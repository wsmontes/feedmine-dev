human_decisions:
  - id: H1
    question: 'Com PR-00 verde, os sete ADRs podem ser congelados conjuntamente no Gate 0?'
    options:
      - 'APROVAR — congelar os sete como um conjunto e exigir amendment para mudança semântica.'
      - 'REJEITAR — manter todos Proposed e registrar a decisão normativa ainda aberta.'
    default_if_undecided: 'Manter todos Proposed; permitir apenas trabalho aditivo/reversível e nenhuma implementação pós-freeze dependente.'
    blocks: [PR-01-01, PR-02-01, PR-03-01, PR-04-01, PR-05-01, PR-06-01, PR-07-01, PR-08-01, PR-08-02, PR-09-01, PR-09-02, PR-09-03]

  - id: H2
    question: 'Quando Runtime V2 pode virar o shipping default?'
    options:
      - 'PREPARE-ONLY — migrar e medir, mantendo legacy como default.'
      - 'AUDIT-GATED — cortar no mesmo release somente com audit local verde.'
      - 'STAGED — ativar em release/flag posterior com fallback legacy.'
    default_if_undecided: 'PREPARE-ONLY; RuntimeMode continua resolvendo stock launch para legacy.'
    blocks: [PR-08-02]

  - id: H3
    question: 'Quando termina a janela oficial de rollback legacy?'
    options:
      - 'Após uma release pública completa.'
      - 'Após duas releases públicas.'
      - 'Após critério quantitativo explícito de estabilidade/migração.'
    default_if_undecided: 'A janela permanece aberta e nenhum legacy path/storage é removido.'
    blocks: [PR-09-03]

  - id: H4
    question: 'Qual é a retenção de read/click/open/consume após content eviction?'
    options:
      - 'Expirar junto com o conteúdo.'
      - 'Usar janela independente e limitada.'
      - 'Reter indefinidamente.'
    default_if_undecided: 'Preservar os fatos existentes e proibir GC que os descarte.'
    blocks: [PR-09-03]

  - id: H5
    question: 'What''s New continua como surface Runtime V2?'
    options:
      - 'SIM — criar FeedPlan/surface próprio em trabalho posterior.'
      - 'NÃO — retirar do roadmap Runtime V2.'
    default_if_undecided: 'Não implementar nem remover contratos existentes; manter fora do critical path.'
    blocks: []

  - id: H6
    question: 'O primeiro cutover V2 preserva o agrupamento temporal visível atual?'
    options:
      - 'SIM — preservar comportamento equivalente no primeiro cutover.'
      - 'NÃO — usar feed contínuo.'
      - 'ADIAR — definir nova política em outro gate de produto.'
    default_if_undecided: 'Preservar o agrupamento atual; não combinar migração arquitetural com redesign de UX.'
    blocks: []