      - 'AUDIT-GATED — cutover no mesmo release apenas quando o migration audit estiver verde.'
      - 'STAGED — ativação posterior/feature-gated com fallback legacy.'
    default_if_undecided: 'PREPARE-ONLY; manter shipping default legacy.'
